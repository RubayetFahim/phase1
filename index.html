<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Authentication</title>
    <meta name="google-signin-client_id" content="365367985791-lsrdiflf30sv90t2v4g9hmk3b7ujhf2u.apps.googleusercontent.com">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container text-center mt-5">
        <h2 class="alert alert-primary">Sign in</h2>
        <div class="g-signin2" data-onsuccess="onSignIn"></div>
        <div class="data">
            <p><strong>Name:</strong> <span id="name" class="alert alert-success"></span></p>
            <p><strong>Profile Pic:</strong></p>
            <img id="image" class="rounded-circle" width="100" height="100" />
            <p><strong>Email:</strong> <span id="email"></span></p>
            <button type="button" class="btn btn-danger mt-3" onclick="signOut();">Sign Out</button>
        </div>
    </div>

    <script src="https://apis.google.com/js/platform.js" async defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
