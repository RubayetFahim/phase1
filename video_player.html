<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Video Player</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body onload="loadUserData()">
    <div class="container">
        <h2 class="text-center mt-3">Social Media Video Player</h2>
        <p><strong>Welcome, <span id="userName"></span>!</strong></p>
        <div class="video-section">
            <div id="videoContainer">
                <iframe id="videoFrame" src="" allowfullscreen></iframe>
            </div>
            <input type="text" id="videoUrl" placeholder="Paste video link here..." class="form-control mt-2">
            <button onclick="playVideo()" class="btn btn-primary mt-2">Play</button>
        </div>
        <div class="subtitle-section">
            <h3>Subtitles</h3>
            <div id="subtitleDisplay" class="subtitle-display">No subtitles available</div>
        </div>
        <button type="button" class="btn btn-danger mt-3" onclick="logout();">Log Out</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
